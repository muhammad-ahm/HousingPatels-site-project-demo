<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Housing Patel | List a Property</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="app.css">
    <link rel="icon" href="./img/frame.png" type="image/x-icon">
</head>
<body>
    <div class="web">
        <header>
            <a href="./index.html"><h1>Housing Patel</h1></a>
            <nav class="top-nav">
                <a href="./properties.html">Browse</a>
                <a href="./add-property.html">List a Property</a>
                <a href="./dashboard.html">Dashboard</a>
            </nav>
        </header>

        <div class="page">
            <div class="form-container">
                <h2>List a Property</h2>
                <div class="form-message form-error" id="formError"></div>
                <div class="form-message form-success" id="formSuccess"></div>
                <form id="propertyForm" novalidate>
                    <label for="title">Title</label>
                    <input type="text" id="title" placeholder="e.g. 3-bed house in DHA Phase 6" required>

                    <label for="propertyType">Type</label>
                    <select id="propertyType" required>
                        <option value="house">House</option>
                        <option value="apartment">Apartment</option>
                        <option value="plot">Plot</option>
                        <option value="commercial">Commercial</option>
                    </select>

                    <label for="price">Price (PKR)</label>
                    <input type="number" id="price" placeholder="15000000" required>

                    <label for="city">City</label>
                    <input type="text" id="city" placeholder="Karachi" required>

                    <label for="address">Address (optional)</label>
                    <input type="text" id="address" placeholder="Street / area">

                    <label for="bedrooms">Bedrooms</label>
                    <input type="number" id="bedrooms" placeholder="3">

                    <label for="bathrooms">Bathrooms</label>
                    <input type="number" id="bathrooms" placeholder="2">

                    <label for="areaSqft">Area (sq ft)</label>
                    <input type="number" id="areaSqft" placeholder="1800">

                    <label for="imageUrl">Image URL (optional)</label>
                    <input type="url" id="imageUrl" placeholder="https://...">

                    <label for="description">Description</label>
                    <textarea id="description" rows="4" placeholder="Tell buyers about this property"></textarea>

                    <br>
                    <button type="submit" id="submitBtn">Submit Listing</button>
                </form>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
